<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#367caf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Syntax: Word Odyssey</title>
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <main class="game" aria-label="Syntax: Word Odyssey">
    <section id="battle" class="battle" aria-label="Battlefield">
      <div class="scenery"></div>
      <div id="chapter-card" class="chapter-card" aria-live="polite"></div>

      <div class="battle-status hero-status">
        <strong>Syntax</strong>
        <div class="health"><i id="hero-bar"></i></div>
        <span>HP <b id="hero-hp">60</b> / 60</span>
      </div>

      <div class="battle-status enemy-status">
        <strong id="enemy-name"></strong>
        <div class="health"><i id="enemy-bar"></i></div>
        <span>HP <b id="enemy-hp"></b> / <b id="enemy-max"></b></span>
      </div>

      <article id="hero-fighter" class="fighter hero-fighter">
        <div id="hero-art" class="hero-art" role="img" aria-label="Syntax">
          <span class="hero-attack-layer" aria-hidden="true"></span>
        </div>
      </article>

      <article id="enemy-fighter" class="fighter enemy-fighter">
        <div id="enemy-art" class="enemy-art" role="img">
          <span class="pip-puppet skeleton-edit" aria-hidden="true">
            <img class="pip-calibration-art" src="assets/pip-neutral.png" alt="">
            <img class="pip-part pip-tail" src="assets/pip-part-tail.png" alt="">
            <span class="pip-limb pip-lower-leg-right"><img src="assets/pip-part-lower-leg-right.png" alt=""></span>
            <span class="pip-limb pip-lower-leg-left"><img src="assets/pip-part-lower-leg-left.png" alt=""></span>
            <span class="pip-limb pip-upper-leg-right"><img src="assets/pip-part-upper-leg-right.png" alt=""></span>
            <span class="pip-limb pip-upper-leg-left"><img src="assets/pip-part-upper-leg-left.png" alt=""></span>
            <span class="pip-limb pip-upper-arm-right"><img src="assets/pip-part-upper-arm-left.png" alt=""></span>
            <img class="pip-part pip-torso" src="assets/pip-part-torso.png" alt="">
            <img class="pip-part pip-head" src="assets/pip-part-head.png" alt="">
            <span class="pip-limb pip-upper-arm-left"><img src="assets/pip-part-upper-arm-left.png" alt=""></span>
            <span class="pip-limb pip-forearm-left"><img src="assets/pip-part-forearm-left.png" alt=""></span>
            <span class="pip-limb pip-forearm-right"><img src="assets/pip-part-forearm-left.png" alt=""></span>
            <img class="pip-part pip-held-pipes" src="assets/pip-part-pipes.png" alt="">
            <svg id="pip-skeleton" class="pip-skeleton" viewBox="0 0 205 215" aria-hidden="true">
              <g class="pip-bones">
                <line data-from="neck" data-to="chest"></line>
                <line data-from="chest" data-to="leftShoulder"></line>
                <line data-from="leftShoulder" data-to="leftElbow"></line>
                <line data-from="leftElbow" data-to="leftHand"></line>
                <line data-from="chest" data-to="rightShoulder"></line>
                <line data-from="rightShoulder" data-to="rightElbow"></line>
                <line data-from="rightElbow" data-to="rightHand"></line>
                <line data-from="chest" data-to="pelvis"></line>
                <line data-from="pelvis" data-to="leftHip"></line>
                <line data-from="leftHip" data-to="leftKnee"></line>
                <line data-from="leftKnee" data-to="leftAnkle"></line>
                <line data-from="leftAnkle" data-to="leftHoof"></line>
                <line data-from="pelvis" data-to="rightHip"></line>
                <line data-from="rightHip" data-to="rightKnee"></line>
                <line data-from="rightKnee" data-to="rightAnkle"></line>
                <line data-from="rightAnkle" data-to="rightHoof"></line>
                <line data-from="pelvis" data-to="tailBase"></line>
                <line data-from="tailBase" data-to="tailTip"></line>
              </g>
              <g class="pip-joints"></g>
            </svg>
          </span>
        </div>
      </article>

      <div id="effects" class="effects" aria-live="polite"></div>
    </section>

    <section class="play-panel">
      <div class="word-panel">
        <span id="word">Loading dictionary…</span>
        <span id="damage">0 damage</span>
      </div>

      <div id="grid" class="grid" aria-label="Letter grid"></div>

      <div class="controls">
        <button id="shuffle" class="shuffle" type="button">Shuffle</button>
        <button id="attack" class="attack" type="button">Attack</button>
      </div>

      <p id="message" class="message" aria-live="polite">Preparing the road…</p>
      <button id="restart" class="restart" type="button">Begin a new odyssey</button>
    </section>
  </main>
  <script src="game.js?v=24"></script>
</body>
</html>
