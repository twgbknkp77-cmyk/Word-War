<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#367caf">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Syntax: Word Odyssey</title>
  <link rel="stylesheet" href="style.css?v=39">
</head>
<body>
  <main class="game" aria-label="Syntax: Word Odyssey">
    <section id="battle" class="battle" aria-label="Battlefield">
      <div class="scenery"></div>
      <div id="chapter-card" class="chapter-card" aria-live="polite"></div>

      <div class="battle-status hero-status">
        <strong>Syntax</strong>
        <div class="health"><i id="hero-bar"></i></div>
        <span class="hp-line">HP <b id="hero-hp">60</b> / <b id="hero-max">60</b> <span id="hero-status-icons" class="status-icons" aria-label="Active effects"></span></span>
      </div>

      <div class="battle-status enemy-status">
        <strong id="enemy-name"></strong>
        <div class="health"><i id="enemy-bar"></i></div>
        <span class="hp-line enemy-hp-line">
          <button id="enemy-moves-toggle" class="enemy-moves-toggle" type="button" aria-expanded="false" aria-controls="enemy-moves" aria-label="Show enemy attacks">⌄</button>
          HP <b id="enemy-hp"></b> / <b id="enemy-max"></b> <span id="enemy-status-icons" class="status-icons" aria-label="Enemy effects"></span>
        </span>
        <div id="enemy-moves" class="enemy-moves" hidden></div>
      </div>

      <article id="hero-fighter" class="fighter hero-fighter">
        <div id="hero-art" class="hero-art" role="img" aria-label="Syntax">
          <span class="hero-attack-layer" aria-hidden="true"></span>
        </div>
      </article>

      <article id="enemy-fighter" class="fighter enemy-fighter">
        <div id="enemy-art" class="enemy-art" role="img">
          <span class="satyr-rig" aria-hidden="true">
            <img class="satyr-rig-layer satyr-tail" src="assets/characters/satyr-rig/layers/tail.png" alt="">

            <span class="satyr-joint satyr-rear-leg">
              <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/rear_thigh.png" alt="">
              <span class="satyr-joint satyr-rear-knee">
                <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/rear_lower_leg.png" alt="">
              </span>
            </span>

            <span class="satyr-joint satyr-front-leg">
              <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/front_thigh.png" alt="">
              <span class="satyr-joint satyr-front-knee">
                <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/front_lower_leg.png" alt="">
              </span>
            </span>

            <span class="satyr-joint satyr-rear-arm">
              <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/rear_upper_arm.png" alt="">
              <span class="satyr-joint satyr-rear-elbow">
                <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/rear_forearm.png" alt="">
              </span>
            </span>

            <span class="satyr-joint satyr-front-arm">
              <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/front_upper_arm.png" alt="">
              <span class="satyr-joint satyr-front-elbow">
                <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/front_forearm.png" alt="">
              </span>
            </span>

            <img class="satyr-rig-layer satyr-core" src="assets/characters/satyr-rig/layers/core.png" alt="">
            <span class="satyr-joint satyr-neck">
              <img class="satyr-rig-layer" src="assets/characters/satyr-rig/layers/head.png" alt="">
            </span>
            <img class="satyr-rig-layer satyr-panpipes" src="assets/characters/satyr-rig/layers/panpipes.png" alt="">
          </span>
        </div>
      </article>

      <div id="effects" class="effects" aria-live="polite"></div>
      <div id="battle-banner" class="battle-banner" role="status" aria-live="assertive"></div>
    </section>

    <section class="play-panel">
      <div class="word-panel">
        <span id="word">Loading dictionary…</span>
        <span id="damage">0 damage</span>
        <button id="clear-selection" class="clear-selection" type="button" aria-label="Clear selected letters" hidden>×</button>
      </div>

      <div id="tile-info" class="tile-info" role="status" aria-live="polite" hidden></div>

      <div id="grid" class="grid" aria-label="Letter grid"></div>

      <div class="controls">
        <button id="shuffle" class="shuffle" type="button">Shuffle</button>
        <button id="attack" class="attack" type="button">Attack</button>
      </div>

      <p id="message" class="message" aria-live="polite">Preparing the road…</p>
      <button id="restart" class="restart" type="button">Begin a new odyssey</button>
    </section>

    <div id="reward-modal" class="reward-modal" hidden>
      <section class="reward-card" role="dialog" aria-modal="true" aria-labelledby="reward-title">
        <p class="reward-kicker">Choose your boon</p>
        <h2 id="reward-title">Victory!</h2>
        <p>Syntax may carry one reward down the road.</p>
        <div id="reward-options" class="reward-options"></div>
      </section>
    </div>
  </main>
  <script src="game.js?v=32"></script>
</body>
</html>
